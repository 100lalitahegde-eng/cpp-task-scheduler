name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [release, thread, address]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          case '${{ matrix.mode }}' in
            release) cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCHEDULER_BUILD_BENCHMARKS=ON ;;
            thread) cmake -S . -B build -DSCHEDULER_THREAD_SANITIZER=ON -DSCHEDULER_BUILD_BENCHMARKS=ON ;;
            address) cmake -S . -B build -DSCHEDULER_ADDRESS_SANITIZER=ON -DSCHEDULER_BUILD_BENCHMARKS=ON ;;
          esac
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCHEDULER_BUILD_BENCHMARKS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Install and relocate package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/scheduler-original"
          mv "$RUNNER_TEMP/scheduler-original" "$RUNNER_TEMP/scheduler-relocated"
          cmake -S tests/consumer -B consumer-installed -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/scheduler-relocated"
          cmake --build consumer-installed --parallel 2
          ctest --test-dir consumer-installed --output-on-failure
      - name: Verify embedded integration
        run: |
          cmake -S tests/consumer -B consumer-embedded -DCMAKE_BUILD_TYPE=Release -DSCHEDULER_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build consumer-embedded --parallel 2
          ctest --test-dir consumer-embedded --output-on-failure
